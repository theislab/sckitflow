name: Lint

on:
  push:
    branches: [main]
  # Deliberately unfiltered: a stacked PR targets another feature branch, and a
  # `branches: [main]` filter makes CI silently skip it -- no checks at all, which
  # reads as "nothing to report" rather than "never ran".
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
