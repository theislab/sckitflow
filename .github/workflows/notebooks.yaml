name: Notebooks

# Executes every notebook under docs/notebooks/ end to end. All three are
# self-contained (no external downloads, no GPU) and the two that train do so
# for a couple of thousand cheap steps, so the whole job is a minute or two.
# Keep it that way: a notebook that needs a GPU or a real training run does not
# belong on this path.

on:
  push:
    branches: [main]
  # Deliberately unfiltered: a stacked PR targets another feature branch, and a
  # `branches: [main]` filter makes CI silently skip it -- no checks at all, which
  # reads as "nothing to report" rather than "never ran".
  pull_request:
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  notebooks:
    name: Execute docs notebooks
    runs-on: ubuntu-latest
    env:
      # Documentation examples must remain runnable on ordinary CPU-only machines.
      # This also prevents a GPU-enabled self-hosted runner from changing their behavior.
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # hatch-vcs derives the version from tags, so the full history is needed.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml
      - name: Install package with notebooks extra
        run: uv sync --extra notebooks --extra cpu
      - name: Execute notebooks
        env:
          MPLBACKEND: agg
        run: uv run ./.run_notebooks.sh
