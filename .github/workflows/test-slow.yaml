name: Test (slow)

# The `slow`-marked tests -- currently the numerical ODE/SDE solver convergence
# suites -- are split out of `test.yaml` so the required fast check stays tight.
# They are sharded with pytest-split, which balances the shards using the
# durations recorded in the committed `.test_durations` file.
#
# Regenerate `.test_durations` after adding or retiring slow tests:
#   pytest tests/ -m slow --store-durations --durations-path=.test_durations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-slow:
    name: slow tests (group ${{ matrix.group }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Two shards is enough for the current slow suite. Bump this number and
        # `--splits` together if the suite grows.
        group: [1, 2]

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # hatch-vcs derives the version from tags, so the full history is needed.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: uv.lock
      # `--locked` fails the job if `uv.lock` is out of date with `pyproject.toml`,
      # rather than silently re-resolving and making the run non-reproducible.
      - name: Install package with test extra
        run: uv sync --locked --extra test --extra cpu
      - name: Run slow tests
        env:
          MPLBACKEND: agg
        run: |
          uv run pytest tests/ \
            -m "slow" \
            --splits 2 \
            --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            --cov=sckitflow \
            --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: slow

  # Single required check for the whole workflow. See
  # https://github.com/re-actors/alls-green#why.
  check:
    name: Slow tests pass
    if: always()
    needs:
      - test-slow
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
