# Tahoe-100M streaming run for sc-flow's torch-native FlowMatching.
#
# Ports cf-train's configs/experiments/tahoe.yaml to the sc-flow FlowSpec/FlowMatching API. Consumed by
# `scripts/tahoe_smoke.py --config configs/tahoe.yaml` (which builds the fixed Tahoe FlowSpec below and
# streams the converted zarr plates via the binded Loader).
#
# Data provenance: the 14 converted plates live at $APP_DATA_DIR/tahoe100_converted/plate*_filt_*.zarr
# (regenerated 2026-07-19 via the cf-train snakemake convert->unify->pca DAG, replacing the old
# hand-rolled plate*.zarr this file used to point at) with obsm/X_pca_pflog2048 (2048-d, scclr pflog +
# whole-data covariance PCA) precomputed; is_control := (drug == "DMSO_TF"). See cf-train configs/tahoe.yaml.

data:
  # Glob of the converted per-plate zarr stores (obsm/X_pca_pflog2048 present). Absolute cluster path.
  plates_glob: /lustre/groups/ml01/datasets/selman.ozleyen/tahoe100_converted/plate*_filt_*.zarr
  sample_rep: X_pca_pflog2048  # obsm rep streamed as the state (2048-d, pflog+cov-PCA)
  drug_col: drug               # perturbation covariate (one-hot encoded; 380 drugs)
  cell_col: cell_line          # match / split context (50 cell lines)
  control_key: is_control      # boolean control mask (drug == DMSO_TF)

model:
  objective: otfm              # otfm | genot
  condition_embedding_dim: 64
  hidden_dims: [1024, 1024, 1024]
  condition_mode: deterministic
  match_method: sinkhorn

train:
  batch_size: 1024
  # binded Loader read pattern: contiguous 32-row runs (aligned to grouped conditions) → cheap sequential
  # reads instead of ~1024 scattered single-row reads/batch. Must divide batch_size. preload_nchunks buffers
  # ~128 batches (4096 chunks). Measured on H100: chunk_size=1 → ~2s/batch; chunk_size=32 → 10s+ faster.
  # chunk_size must be <= the shortest contiguous on-disk run of every *drawn* leaf (annbatch's rule).
  # Measured over all 14 raw `tahoe100_converted` plates: chunk_size<=16 validates (~1.7ms/batch, ~584
  # batch/s vs 0.5 at chunk=1); chunk_size=32 fails on the CONTROL node — a (cell_line) control run in some
  # plate is <32. To use chunk_size=32 either group the controls (cf-train's consolidated controls.zarr) or
  # set control_in_memory (in-RAM nodes are exempt from the run-length rule). 16 is the safe default here.
  chunk_size: 16
  preload_nchunks: 2048          # ~32 batches (batch/chunk * 32); big enough that synchronous refills don't stall
  # Zero-weight (exclude) target leaves whose SHORTEST contiguous run < this (cf-train's min_cells_per_condition).
  # Must be >= chunk_size so the target node satisfies the run-length rule. Only filters targets, not controls.
  min_runs_per_leaf: 16
  n_train_steps: 30000
  valid_freq: 2000
  lr: 0.0001
  device: cuda
  # Held out whole drugs → the validation loop translates held-out controls and scores r_squared / e-dist.
  split_by: [drug]
  split_ratios: {train: 0.8, val: 0.2}
