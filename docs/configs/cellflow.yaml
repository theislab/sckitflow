# CellFlow: OT-matched conditional flow matching from control to perturbed cells.
# Load with `ModelConfig.from_spec(yaml.safe_load(...))`, then `model = spec.build(adata)`.
# The experiment sets the rest; CellFlow's: Adam (lr 1e-4), batch size 1024, 50000 steps.
type: model

data:
  type: data_manager
  sample_rep: X_pca
  rep_lin: X_pca                  # OT cost on the PCA space; unset, it falls back to X
  categorical_conditions:
    drug: [drug1, drug2]          # a combination is a set of drugs
  categorical_reps:
    drug: drug                    # adata.uns["drug"][name] -> embedding
  control_values_dict:
    drug: control
  groups: [cell_line]             # controls are drawn from the same cell line
  groups_reps:
    cell_line: cell_line          # adata.uns["cell_line"][name] -> embedding
  split_by: split                 # written by the experiment beforehand, e.g. a splitter.combination

module:
  type: velocity_field.mlp
  time_features_id: ott-jax
  num_time_features: 128
  time_encoder_output_dim: 256
  state_encoder_output_dim: 256
  state_encoder_mlp_kwargs: {hidden_dims: [1024]}
  conditioning_id: concat
  vf_decoder_mlp_kwargs: {hidden_dims: [1024, 1024]}
  condition_encoder_output_dim: 256
  condition_encoder_pooling_mode: attention-token
  condition_encoder_pooling_kwargs: {num_heads: 8, qkv_dim: 64}
  condition_encoder_input_layers:   # input_dim comes from the embeddings
    drug: {output_dim: 256, hidden_dims: [512]}
    cell_line: {output_dim: 256, hidden_dims: [512]}

training:
  type: training_method.matched
  coupling:
    type: coupling.pot.sinkhorn
    reg: 0.5
  method:
    type: training_method.cfm
    probability_path:               # CellFlow's default: constant noise 0
      type: probability_path.linear_dirac

inference:
  type: inference_method.ode
  n_steps: 50
  solver_kwargs: {method: euler}
