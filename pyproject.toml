[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "sckitflow"
description = "Flow Matching tool-box for Single Cell Data."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Lorenzo Consoli", email = "lorenzo.consoli@helmholtz-munich.de" },
]
authors = [
  { name = "Lorenzo Consoli" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.13",      # scfit streams via the anndata>=0.13 acc reference system
  "lightning>=2.2",     # the training loop, optimizer stepping and logging
  "numpy>=1.26",
  "pandas>=2",
  "pot>=0.9",
  "scfit>=0.0.12",      # annbatch-native streaming data layer, the component registry and Hub save/load
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
  "torchdiffeq>=0.2.4",
  "torchmetrics>=1.4",
  "torchsde>=0.2.6",
  "tqdm>=4.66",
]
# Everything an end user could want, minus the dev/doc/test tooling.
optional-dependencies.all = [
  "sckitflow[logging,torch]",
]

# Accelerator selectors for uv-managed development and CI environments: torch from the matching PyTorch index
# and, on CUDA, cupy of the same CUDA major, so both share one set of CUDA libraries.
optional-dependencies.cpu = [
  "torch>=2.2",
]
optional-dependencies.cu126 = [
  "sckitflow[cupy-cuda12]",
  "torch>=2.2",
]
optional-dependencies.cu130 = [
  "sckitflow[cupy-cuda13]",
  "torch>=2.2",
]
# GPU-resident streaming (`preload_to_gpu`): scfit/annbatch keep the read window on-device via cupy. Pick the CUDA
# major of your torch build; cupy brings its CUDA toolkit wheels, so only a driver is needed.
optional-dependencies.cupy-cuda12 = [
  "scfit[cupy-cuda12]>=0.0.13",
]
optional-dependencies.cupy-cuda13 = [
  "scfit[cupy-cuda13]>=0.0.13",
]

optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  # Until pybtex >0.24.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
]
# Imported lazily inside `sckitflow.trainer._callbacks.WandBLogger`.
optional-dependencies.logging = [
  "omegaconf",
  "wandb",
]
# Executes the notebooks under `docs/notebooks/` in CI.
optional-dependencies.notebooks = [
  "ipykernel",
  "matplotlib",
  "nbclient",
  "nbformat",
  "sckitflow[torch]",
]
optional-dependencies.test = [
  "cloudpickle>=3",           # the pickling round-trip test
  "coverage",
  "pytest",
  "pytest-cov",
  "pytest-split",             # shards the `slow` job by recorded duration (`.test_durations`)
  "pytest-xdist>=3",
  "sckitflow[logging,torch]", # TestWandBLogger imports omegaconf for real (wandb itself is mocked)
]
# Kept so `sckitflow[torch]` still installs; the torch stack is a core dependency (`import sckitflow` needs it).
optional-dependencies.torch = [  ]

# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://sckitflow.readthedocs.io/"
urls.Homepage = "https://github.com/theislab/sckitflow"
# Accelerator-specific sources are selected only when their matching extra is
# enabled. The generic `torch` extra remains accelerator-neutral.
urls.Source = "https://github.com/theislab/sckitflow"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [ "src/sckitflow" ]

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# Test the lowest and highest supported Python versions with normal deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.12", "3.13" ]

# Test the newest supported Python version also with pre-release deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "pre" ]
python = [ "3.13" ]

[tool.hatch.envs.hatch-test]
features = [ "cpu", "test" ]

[tool.hatch.envs.hatch-test.overrides]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = [ "pre" ] },
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "NPY002", # legacy global np.random.* -- pass a numpy Generator instead (NEP 19, SPEC 7)
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
# too many positional arguments: name the rest after `*`, as squidpy does
lint.extend-select = [ "PLR0917" ]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.explicit-preview-rules = true # only the preview rules selected by name, i.e. PLR0917
lint.per-file-ignores."*/__init__.py" = [ "F401", "F822" ] # F822: lazy `__getattr__` exports, flagged under preview
lint.per-file-ignores."docs/*" = [ "I", "PLR0917" ]
lint.per-file-ignores."tests/*" = [ "D", "PLR0917" ]
lint.pydocstyle.convention = "numpy"
lint.preview = true

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
  "--strict-markers",
]
markers = [
  "slow: deselect with `-m 'not slow'` (large fixtures / long-running training loops)",
]

[tool.coverage.run]
source = [ "sckitflow" ]
# The test job runs under pytest-xdist, so each worker is a separate process and needs
# its own data file for `coverage combine` to pick it up.
parallel = true
omit = [
  "**/test_*.py",
]

[tool.uv]
# One CUDA major per environment: a cupy extra on its own may sit next to PyPI's torch, so these keep the selectors
# resolving separately (otherwise `cu126` inherits the older cupy that fits CUDA 13 torch).
conflicts = [
  [ { extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" } ],
  [ { extra = "cupy-cuda12" }, { extra = "cupy-cuda13" } ],
  [ { extra = "cu126" }, { extra = "cupy-cuda13" } ],
  [ { extra = "cu130" }, { extra = "cupy-cuda12" } ],
  [ { extra = "cpu" }, { extra = "cupy-cuda12" } ],
  [ { extra = "cpu" }, { extra = "cupy-cuda13" } ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
